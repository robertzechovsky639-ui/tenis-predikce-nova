name: Retrain a nasazení
on:
  schedule:
    - cron: "30 2 * * *"   # 04:30 Praha v létě (UTC+2)
    - cron: "30 3 * * *"   # 04:30 Praha v zimě (UTC+1) – guard níže pustí jen jeden z nich
    - cron: "15 * * * *"   # hodinová lehká aktualizace (hráči/zápasy, model beze změny)
  workflow_dispatch:
    inputs:
      mode: { description: "full | light", default: "full" }
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Rozhodnout režim
        id: m
        run: |
          H=$(TZ=Europe/Prague date +%H)
          S="${{ github.event.schedule }}"
          MODE=full; RUN=1
          [ "${{ github.event_name }}" = "push" ] && MODE=light   # push = jen web se stávajícím modelem, bez retrainu
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$S" = "15 * * * *" ]; then MODE=light
              [ "$H" = "04" ] && RUN=0   # v hodině plného retrainu lehkou přeskočit
            else
              [ "$H" = "04" ] || RUN=0   # plný retrain jen v 04:xx pražského času
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT; echo "run=$RUN" >> $GITHUB_OUTPUT
          echo "Praha $H h, režim $MODE, běh $RUN"
      - uses: actions/checkout@v4
        if: steps.m.outputs.run == '1'
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        if: steps.m.outputs.run == '1'
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        if: steps.m.outputs.run == '1'
        with: { node-version: "20" }
      - if: steps.m.outputs.run == '1'
        run: pip install numpy "scikit-learn>=1.5" "xgboost>=3.0"
      - name: Stáhnout nové výsledky (failover Sackmann → TML → Sofascore → ESPN)
        if: steps.m.outputs.run == '1' && github.event_name != 'push'
        run: python3 fetch_recent.py
      - name: Plný retrain
        if: steps.m.outputs.run == '1' && steps.m.outputs.mode == 'full'
        run: python3 build.py
      - name: Lehká aktualizace
        if: steps.m.outputs.run == '1' && steps.m.outputs.mode == 'light'
        run: python3 build.py --light
      - name: Testy
        if: steps.m.outputs.run == '1'
        run: |
          node --test tests/
          python3 -m unittest discover -s tests
      - name: Uložit data zpět do repa
        if: steps.m.outputs.run == '1' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/recent.csv data/recent_sources.json web/data
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizace dat (${{ steps.m.outputs.mode }}) [skip ci]"
          # remote se mohl mezitím posunout (push kódu) -> fetch + rebase (data z tohoto běhu vyhrávají) + push, max 3 pokusy
          for i in 1 2 3; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; echo "push pokus $i selhal, zkouším znovu"; sleep $((i*5))
          done
          exit 1
      - uses: actions/configure-pages@v5
        if: steps.m.outputs.run == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.m.outputs.run == '1'
        with: { path: web }
    outputs:
      run: ${{ steps.m.outputs.run }}
  deploy:
    needs: build
    if: needs.build.outputs.run == '1'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
